<style>

:1px solid #ead7d8;border-radius:999px;padding:7px 11px;font-size:10px;background:#fff}.dot{width:7px;height:7px;border-radius:50%;background:#2da96d;box-shadow:0 0 0 4px #e8f7ee}.avatar{width:32px;height:32px;border-radius:50%;background:#f7dfe0;color:var(--deep);display:grid;place-items:center;font-weight:700;font-size:11px}.crumb{padding:24px 0 16px;color:var(--muted);font-size:11px}.crumb a{color:var(--red);font-weight:600}.hero{background:linear-gradient(110deg,#fff,#fff5f5);border:1px solid #ead8da;border-radius:18px;padding:25px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-80px;top:-110px;width:270px;height:270px;border-radius:50%;border:45px solid rgba(169,20,32,.045)}.hero-row{display:flex;justify-content:space-between;align-items:center;gap:25px;position:relative;z-index:1}.patient-heading{display:flex;align-items:center;gap:19px}.initials{width:68px;height:68px;border-radius:50%;background:#f9dfe0;color:var(--deep);display:grid;place-items:center;font-weight:700;font-size:20px}.patient-id{font-family:"Playfair Display",serif;font-size:43px;line-height:.95;color:var(--deep);font-weight:700}.patient-name{font-size:17px;font-weight:700;margin-top:5px}.patient-meta{font-size:10px;color:var(--muted);margin-top:8px}.hero-actions{display:flex;align-items:center;gap:9px}.btn{border:1px solid #e1cfd1;background:#fff;color:var(--deep);padding:10px 14px;border-radius:9px;font-weight:700;font-size:11px;transition:.2s;display:inline-flex;align-items:center;gap:8px}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(127,13,23,.09)}.btn-primary{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(169,20,32,.18)}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px;overflow:auto}.tab{padding:14px 17px;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap;border-bottom:2px solid transpar vity-time{font-size:8px;color:var(--muted);margin-top:3px}.full{margin-top:16px}.analysis-grid{grid-template-columns:1.15fr .85fr;margin-top:16px}.chart-wrap{height:290px;position:relative}.chart-wrap.small{height:250px}.analysis-note{background:#fff5f5;border:1px solid #f1dddd;padding:11px;border-radius:10px;font-size:9px;color:#7d5d61;line-height:1.5;margin-top:10px}.signal-list{display:flex;flex-direction:column;gap:10px}.signal{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:#fff9f9;border:1px solid #f0e5e6;border-radius:10px;font-size:10px}.signal strong{color:var(--deep)}.badge{font-size:8px;font-weight:800;padding:5px 8px;border-radius:999px}.badge-concern{background:#fde4e5;color:var(--red)}.badge-watch,.badge-monitor{background:var(--amberbg);color:var(--amber)}.badge-stable{background:var(--greenbg);color:var(--green)}.alert-box{padding:16px;border-radius:12px;background:#fff6f6;border:1px solid #f0d9da}.alert-title{font-weight:800;color:var(--red);font-size:12px}.alert-copy{font-size:10px;line-height:1.55;color:#6f5b5f;margin-top:7px}.timeline{display:flex;flex-direction:column;gap:9px}.refill-row{display:grid;grid-template-columns:82px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f1e7e8}.refill-row:last-child{border-bottom:0}.refill-date{font-size:9px;color:var(--muted)}.refill-bar{height:7px;background:#f2e9ea;border-radius:99px;overflow:hidden}.refill-fill{height:100%;background:linear-gradient(90deg,#d95760,var(--red));border-radius:99px}.refill-days{font-size:10px;font-weight:800;color:var(--deep)}.context-grid{grid-template-columns:repeat(3,1fr);margin-top:16px}.context-box{padding:15px;border-radius:12px;background:#fffafa;border:1px solid #f0e5e6}.context-icon{font-size:19px}.context-name{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-top:7px}.context-value{font-family:"Playfair Display",serif;font-size:22px;color:var(--deep);margin-top ;align-items:center;gap:10px}.landing-brand .logo-mark{border-color:var(--red)}.landing-brand .logo-mark svg{stroke:var(--red)}.landing-brand .brand-name{color:var(--deep)}.landing-links{display:flex;gap:22px;font-size:10px;color:var(--muted);font-weight:700}.landing-main{text-align:center;padding:72px 0 52px}.hero-logo{width:82px;height:82px;border:2px solid var(--red);border-radius:24px;margin:0 auto 23px;display:grid;place-items:center;box-shadow:0 15px 35px rgba(169,20,32,.11);background:#fff}.hero-logo svg{width:53px;stroke:var(--red)}.landing-main h1{font-family:"Playfair Display",serif;font-size:64px;line-height:1;color:var(--deep);margin:0;letter-spacing:-1.5px}.landing-main h1 span{color:var(--red)}.landing-main p{max-width:560px;margin:18px auto 0;font-size:14px;line-height:1.7;color:var(--muted)}.landing-cta{margin-top:28px}.visual{margin:8px auto 0;width:min(900px,100%);height:260px;border-radius:22px;border:1px solid #ead8da;box-shadow:var(--shadow);overflow:hidden;background:#fff;position:relative}.visual img{width:100%;height:100%;object-fit:cover;opacity:.86;filter:saturate(.75)}.visual-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,250,250,.9),rgba(255,255,255,.18),rgba(127,13,23,.08))}.visual-copy{position:absolute;left:32px;top:36px;text-align:left;max-width:310px}.visual-copy h2{font-family:"Playfair Display",serif;color:var(--deep);font-size:28px;margin:0}.visual-copy p{font-size:10px;color:#7b666a;line-height:1.6;margin-top:8px}.landing-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.landing-stat{padding:17px;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:13px}.landing-stat b{font-family:"Playfair Display",serif;font-size:23px;color:var(--deep)}.landing-stat span{display:block;font-size:9px;color:var(--muted);margin-top:4px}.fade{animation:fade .55s ease both}.fade2{animation:fade .7s .08s ease both}.fade3{animation:fade .85s .16s ease both}@keyframes fade
